[package]
name = "shion-front"
description = "shion's SSH front-end: authenticates users and connects them to their session processes"
version.workspace = true
edition.workspace = true
# russh's minimum, higher than the rest of the workspace's.
rust-version = "1.89"
publish.workspace = true

[dependencies]
shion-mux.workspace = true
shion-wire.workspace = true

async_smux.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
russh.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
